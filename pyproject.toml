[project]
name = "local-stock-agent"
version = "0.1.0"
description = "Offline stock-data agent demonstration with Ollama and read-only SQLite tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pg8000>=1.31,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
